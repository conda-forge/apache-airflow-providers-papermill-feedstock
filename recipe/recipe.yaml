context:
  name: apache-airflow-providers-papermill
  version: "3.13.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/apache_airflow_providers_papermill-${{ version }}.tar.gz
  sha256: 0a709fec0e6722864b4506fc4071a1efbd4e5ecd327ae402463297c4d4c2c8f5

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core ==4.1.0
  run:
    - python >=${{ python_min }}
    - apache-airflow >=2.11.0
    - apache-airflow-providers-common-compat >=1.8.0
    - papermill >=2.6.0
    # start papermill[all]
    - azure-datalake-store >=0.0.30,<1.0.0a0
    - azure-storage-blob >=12.1
    - requests >=2.21
    - azure-identity >=1.3.1
    - gcsfs >=0.2
    - pygithub >=1.55
    - pyarrow >=2
    - boto3
    - black >=19.3b0
    # end papermill[all]
    # scrapbook[all] needs nothing extra on conda-forge
    - scrapbook >=0.5.0
    - ipykernel >=6.29.4
    # tightest of upstream's floors (python >=3.14)
    - pandas >=2.3.3
    - nbconvert >=7.16.1

tests:
  - python:
      imports:
        - airflow.providers.papermill
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/apache/airflow/
  summary: Provider package apache-airflow-providers-papermill for Apache Airflow
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-papermill/stable/index.html
  repository: https://github.com/apache/airflow/

extra:
  recipe-maintainers:
    - xylar
